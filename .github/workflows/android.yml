name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.PETLOG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # El runner de Ubuntu ya trae el SDK de Android (ANDROID_HOME); Gradle instala lo que falte.
      - name: Dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Compilar la web y copiarla al proyecto Android
        run: |
          npm run build
          npx cap sync android

      - name: Clave de firma (si está configurada)
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.PETLOG_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/petlog-release.keystore"
          echo "PETLOG_KEYSTORE_PATH=$RUNNER_TEMP/petlog-release.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          PETLOG_KEYSTORE_PASSWORD: ${{ secrets.PETLOG_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/PetLog-0.3.${GITHUB_RUN_NUMBER}.apk"
          # Paquete para Google Play (sin clave propia sale sin firmar: se firma con jarsigner antes de subirlo).
          cp app/build/outputs/bundle/release/app-release.aab "../out/PetLog-0.3.${GITHUB_RUN_NUMBER}.aab"

      - name: Comprobar firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/*.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: PetLog-apk
          path: |
            out/*.apk
            out/*.aab

      - name: Publicar en Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.${GITHUB_RUN_NUMBER}"
          if [ "$HAS_KEY" = "true" ]; then
            gh release create "$TAG" out/*.apk out/*.aab \
              --title "PetLog 0.3.${GITHUB_RUN_NUMBER}" \
              --notes "APK de PetLog compilado desde ${GITHUB_SHA::7}. Firmado con la clave propia de PetLog: se instala encima de la versión anterior sin desinstalar y conservando los datos."
          else
            # Sin la clave propia el APK lleva una firma de prueba distinta en cada compilación:
            # no sirve para actualizar. Se publica como versión preliminar y con otro nombre para no confundirlo.
            mv out/*.apk "out/PetLog-0.3.${GITHUB_RUN_NUMBER}-firma-de-prueba.apk"
            mv out/*.aab "out/PetLog-0.3.${GITHUB_RUN_NUMBER}-sin-firmar.aab"
            gh release create "$TAG" out/*.apk out/*.aab --prerelease \
              --title "PetLog 0.3.${GITHUB_RUN_NUMBER} (firma de prueba)" \
              --notes "Compilado desde ${GITHUB_SHA::7} con una firma de prueba: NO lo instales encima de PetLog, obligaría a desinstalar. Usa el APK firmado con la clave de PetLog (scripts/sign_apk.py) o configura los secretos PETLOG_KEYSTORE_BASE64 y PETLOG_KEYSTORE_PASSWORD para que esta compilación lo firme directamente."
          fi
